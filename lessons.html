
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Your Lessons</title>
</head>
<body>
  <h2>Welcome to Sparkle Lessons!</h2>
  <p id="welcome"></p>

  <ul id="lesson-list"></ul>

  <script>
    // Display current user
    var user = localStorage.getItem("currentUser");
    document.getElementById("welcome").textContent = "Hello, " + user + "!";

    // Generate lesson links dynamically
    var lessonList = document.getElementById("lesson-list");
    for (var i = 1; i <= 30; i++) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "lesson" + i + ".html"; // Link to lesson1.html, lesson2.html, etc.
      a.textContent = "Lesson " + i;
      li.appendChild(a);
      lessonList.appendChild(li);
    }
  </script>
</body>
</html>
