<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Last Test</title>
  <style>
      button {
     color:white;
     background-color:purple;
     border-radius:8px;
   }
    body {
      background-color:rgb(199,25,212);
      font-family:serif, sans-serif;
    }
    p {
      color:white;
    } 
  </style>
</head>
<body>
  <h1>Last test</h1>

  <div id="quiz-section">
    <div class="question">
      <h3>Question 1: What is the value of the 3 in 345?</h3>
      <div class="options">
        <button>3</button>
        <button>30</button>
        <button data-correct="true">300</button>
        <button>45</button>
      </div>
    </div>

    <div class="question">
      <h3>Question 2: What is a Main Idea?</h3>
      <div class="options">
        <button>It is a detail from the story</button>
        <button data-correct="true">It is what the story is about</button>
        <button>It is the text under a picture</button>
        <button>It is the summary of a story</button>
      </div>
    </div>

    <div class="question">
      <h3>Question 3: How many phases does the moon have?</h3>
      <div class="options">
        <button data-correct="true">8</button>
        <button>7</button>
        <button>4</button>
        <button>1</button>
      </div>
    </div>

    <div class="question">
      <h3>Question 4: What is 789+45 =</h3>
      <div class="options">
        <button data-correct="true">834</button>
        <button>769</button>
        <button>894</button>
        <button>799</button>
      </div>
    </div>

    <h3>Results</h3>
    <div id="result">Correct: 0, Wrong: 0</div>
  </div>

<script>
  var correctCount = 0;
  var wrongCount = 0;

  function updateResult() {
    document.getElementById('result').textContent = 'Correct: ' + correctCount + ', Wrong: ' + wrongCount;
  }

  var questionEls = document.querySelectorAll('.question');
  questionEls.forEach(function(qEl) {
    var answered = false;
    var buttons = qEl.querySelectorAll('button');
    buttons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (answered) return;
        answered = true;
        buttons.forEach(function(b) { b.disabled = true; });
        if (this.getAttribute('data-correct') === 'true') {
          correctCount++;
        } else {
          wrongCount++;
        }
        updateResult();
      });
    });
  });

  updateResult();
</script>
</body>
</html>
